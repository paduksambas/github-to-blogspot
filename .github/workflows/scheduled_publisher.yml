name: Scheduled Draft Publisher (Blogger & Facebook)

on:
  schedule:
    # Jadwal Tayang 4 Kali Sehari pada Jam Emas Pembaca (WIB = UTC+7):
    # - 07:30 WIB (00:30 UTC) -> Berita Pagi / Mengawali Aktivitas
    # - 12:30 WIB (05:30 UTC) -> Istirahat Siang / Makan Siang
    # - 17:30 WIB (10:30 UTC) -> Berita Sore / Perjalanan Pulang Kerja
    # - 20:30 WIB (13:30 UTC) -> Prime Time Malam / Waktu Santai Keluarga
    - cron: '30 0 * * *'
    - cron: '30 5 * * *'
    - cron: '30 10 * * *'
    - cron: '30 13 * * *'

  workflow_dispatch:
    inputs:
      limit:
        description: 'Jumlah draf artikel yang ingin diterbitkan sekaligus'
        required: false
        default: '1'
      file:
        description: 'Jalur spesifik berkas draf (opsional, contoh: posts/2026-11-26-bupati-kupang-yosef-lede-resmi-ditahan-usai-jadi-t.md)'
        required: false
        default: ''
      skip_fb:
        description: 'Lewati penerbitan ke Facebook Page'
        type: boolean
        required: false
        default: false
      skip_telegram:
        description: 'Lewati notifikasi Telegram'
        type: boolean
        required: false
        default: false

jobs:
  scheduled_publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Izin commit perubahan status draf -> publish ke GitHub repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scheduled Draft Publisher
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          CMD="python scripts/schedule_publisher.py"
          
          # Tambahkan opsi limit jika ada
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            CMD="$CMD --limit ${{ github.event.inputs.limit }}"
          else
            CMD="$CMD --limit 1"
          fi

          # Tambahkan opsi target file jika ada
          if [ -n "${{ github.event.inputs.file }}" ]; then
            CMD="$CMD --file \"${{ github.event.inputs.file }}\""
          fi

          # Facebook ditangani mandiri secara berkala setiap 1 jam oleh facebook_hourly.yml
          CMD="$CMD --skip-fb"

          # Opsi skip Telegram
          if [ "${{ github.event.inputs.skip_telegram }}" = "true" ]; then
            CMD="$CMD --skip-telegram"
          fi

          echo "[*] Menjalankan: $CMD"
          eval $CMD

      - name: Commit and push status updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/ published_history.json
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan status artikel untuk di-commit."
          else
            git commit -m "Scheduled Publisher: Terbitkan draf ke Blogger & Facebook [skip ci]"
            git push
          fi
