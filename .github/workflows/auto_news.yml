name: Auto News Bot (Scanner, AI Rewriter & Publisher)

on:
  schedule:
    # Berjalan 4 kali sehari (Waktu WIB: 08:00, 13:00, 18:00, 21:00)
    # Waktu UTC: 01:00, 06:00, 11:00, 14:00
    - cron: '0 1,6,11,14 * * *'
  workflow_dispatch: # Bisa dijalankan manual kapan saja via tombol Run Workflow

jobs:
  auto_news:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Izin untuk menyimpan artikel baru & history ke repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Auto News Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOGGER_SECRET_EMAIL: ${{ secrets.BLOGGER_SECRET_EMAIL }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
        run: |
          python scripts/auto_news.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/ published_history.json
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan artikel baru untuk di-commit."
          else
            git commit -m "Auto News: Tambah artikel viral terbaru [skip ci]"
            git push
          fi
