name: Hourly Facebook Viral News Publisher

on:
  schedule:
    # Berjalan mandiri setiap 1 jam (menit ke-17 untuk menghindari antrean puncak GitHub di menit :00)
    - cron: '17 * * * *'

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Mode Uji Coba (Dry-Run): filter dan buat kartu tanpa posting ke Facebook'
        type: boolean
        required: false
        default: false
      force:
        description: 'Paksa posting (abaikan riwayat pernah tayang)'
        type: boolean
        required: false
        default: false

concurrency:
  group: facebook-hourly-publisher
  cancel-in-progress: false

jobs:
  publish_hourly_facebook:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Hourly Facebook Viral Publisher
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          CMD="python scripts/facebook_viral_publisher.py"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            CMD="$CMD --dry-run"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            CMD="$CMD --force"
          fi
          echo "[*] Menjalankan: $CMD"
          eval $CMD

      - name: Commit and push history updates
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Tambahkan riwayat postingan Facebook dan kartu yang dibuat
          git add facebook_published_history.json posts/facebook_drafts/ || true
          
          if git diff --staged --quiet; then
            echo "[*] Tidak ada pembaruan riwayat postingan Facebook yang perlu di-commit."
          else
            git commit -m "chore(facebook): sync hourly viral post history [skip ci]"
            git pull --rebase origin main || true
            git push origin main
            echo "[+] Berhasil memperbarui riwayat postingan Facebook ke repository."
          fi
