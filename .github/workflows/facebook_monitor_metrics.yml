name: Facebook Health & Follower Metrics Monitor

on:
  schedule:
    # Berjalan setiap 3 jam di menit ke-42 untuk mengecek kesehatan token & jumlah pengikut
    - cron: '42 */3 * * *'

  workflow_dispatch:

concurrency:
  group: facebook-health-metrics-monitor
  cancel-in-progress: false

jobs:
  check_metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Token Health & Collect Facebook Metrics
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/facebook_health_and_metrics.py

      - name: Commit and push metrics update
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add facebook_metrics.json || true

          if git diff --staged --quiet; then
            echo "[*] Tidak ada pembaruan metrik."
          else
            git commit -m "chore(monitor): update facebook health & follower metrics [skip ci]"
            git pull --rebase origin main || true
            git push origin main
            echo "[+] Metrik kesehatan & pengikut Facebook berhasil diperbarui."
          fi
